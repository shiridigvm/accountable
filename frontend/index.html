<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%2306D6A0%22/%3E%3C/svg%3E"
    />
    <title>Accountable</title>
    <script>
      // Applies the saved theme before the first paint (R35). The app's own
      // module loads too late for that. Same key and values as src/lib/theme.ts.
      // 'light' and 'dark' are kept as chosen. Anything else, or blocked storage,
      // means System, which follows the device (R32).
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem('accountable-theme');
        } catch {
          // Storage is blocked. Follow the device.
        }
        var dark =
          choice === 'dark' ||
          (choice !== 'light' &&
            !!window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.dataset.theme = 'dark';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
