[project]
name = "accountable"
version = "0.1.0"
description = "Accountable: a local sales CRM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/accountable"]
dev-mode-dirs = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
