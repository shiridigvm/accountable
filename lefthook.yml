# Pre-commit checks. Tests are left to `npm test` and CI so commits stay quick.
# Commands run in priority order and stop at the first failure.
pre-commit:
  piped: true
  commands:
    prettier:
      priority: 1
      glob: "*.{js,jsx,ts,tsx,json,css,md,yml,yaml}"
      run: npx --no-install prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    ruff-format:
      priority: 2
      glob: "backend/**/*.py"
      run: uv run -m ruff format {staged_files}
      stage_fixed: true
    lint:
      priority: 3
      run: npm run lint
    types:
      priority: 4
      run: npm run typecheck
    secrets:
      priority: 5
      run: gitleaks protect --staged -c .gitleaks.toml --no-banner
